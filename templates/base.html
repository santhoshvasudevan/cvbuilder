<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resume Builder{% endblock %}</title>
  <style>
    :root {
      --color-bg: #f7f7f9;
      --color-surface: #ffffff;
      --color-border: #d8dbe0;
      --color-text: #1a1d23;
      --color-text-muted: #5b616e;
      --color-primary: #1b4f9c;
      --color-primary-dark: #123a75;
      --color-success-bg: #e4f5e9;
      --color-success-text: #1b6b3a;
      --color-warning-bg: #fdf1dc;
      --color-warning-text: #8a5a00;
      --color-danger-bg: #fbe6e6;
      --color-danger-text: #9c2020;
      --color-danger-border: #f0bcbc;
      --color-neutral-bg: #eceef1;
      --color-neutral-text: #444a55;
      --radius: 8px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 16px;
      --space-4: 24px;
      --space-5: 40px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
    }
    a { color: var(--color-primary); }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #8fb8ff;
      outline-offset: 2px;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .site-header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-3) var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-2);
    }
    .site-header h1 { font-size: 1.15rem; margin: 0; }
    .site-header h1 a { color: var(--color-text); text-decoration: none; }
    .site-nav a {
      margin-left: var(--space-3);
      text-decoration: none;
      font-weight: 500;
      color: var(--color-text-muted);
    }
    .site-nav a:hover { color: var(--color-primary); }
    main { max-width: 1100px; margin: 0 auto; padding: var(--space-4); }
    .breadcrumbs {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      margin-bottom: var(--space-3);
    }
    .breadcrumbs a { text-decoration: none; }
    .breadcrumbs a:hover { text-decoration: underline; }
    .breadcrumbs .sep { margin: 0 var(--space-1); }
    h1 { font-size: 1.5rem; margin-top: 0; }
    h2 { margin-top: var(--space-4); }
    .lede { color: var(--color-text-muted); max-width: 65ch; }
    .messages { list-style: none; padding: 0; margin: 0 0 var(--space-4); }
    .messages li {
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius);
      margin-bottom: var(--space-2);
      border: 1px solid transparent;
    }
    .messages li.success { background: var(--color-success-bg); color: var(--color-success-text); border-color: #b8e3c6; }
    .messages li.error { background: var(--color-danger-bg); color: var(--color-danger-text); border-color: var(--color-danger-border); }
    p.error {
      background: var(--color-danger-bg);
      color: var(--color-danger-text);
      border: 1px solid var(--color-danger-border);
      border-radius: var(--radius);
      padding: var(--space-2) var(--space-3);
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
    }
    dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-2) var(--space-4); margin: 0; }
    dl.kv dt { font-weight: 600; color: var(--color-text-muted); }
    dl.kv dd { margin: 0; }
    .btn {
      display: inline-block;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius);
      background: var(--color-primary);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--color-primary);
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn:hover { background: var(--color-primary-dark); border-color: var(--color-primary-dark); }
    .btn-secondary { background: var(--color-surface); color: var(--color-primary); }
    .btn-secondary:hover { background: #eef3fb; }
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-success { background: var(--color-success-bg); color: var(--color-success-text); }
    .badge-warning { background: var(--color-warning-bg); color: var(--color-warning-text); }
    .badge-danger { background: var(--color-danger-bg); color: var(--color-danger-text); }
    .badge-neutral { background: var(--color-neutral-bg); color: var(--color-neutral-text); }
    .summary-counts { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-bottom: var(--space-4); }
    .summary-counts .stat {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: var(--space-3);
      min-width: 140px;
      flex: 1 1 140px;
    }
    .summary-counts .num { font-size: 1.6rem; font-weight: 700; display: block; }
    .summary-counts .label { color: var(--color-text-muted); font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; background: var(--color-surface); }
    th, td {
      text-align: left;
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--color-border);
      vertical-align: top;
    }
    th { background: var(--color-neutral-bg); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.02em; }
    tbody tr:last-child td { border-bottom: none; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--color-border); border-radius: var(--radius); }
    .table-wrap table { border: none; }
    .empty-state { text-align: center; padding: var(--space-5) var(--space-3); color: var(--color-text-muted); }
    .empty-state .btn { margin-top: var(--space-3); }
    .stepper { display: flex; flex-direction: column; gap: var(--space-3); }
    .step {
      display: flex;
      gap: var(--space-3);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-border);
      border-radius: var(--radius);
      padding: var(--space-3);
      align-items: flex-start;
    }
    .step.is-done { border-left-color: var(--color-success-text); }
    .step.is-current { border-left-color: var(--color-primary); background: #f5f8fd; }
    .step.is-blocked { opacity: 0.7; }
    .step.is-failed { border-left-color: var(--color-danger-text); background: var(--color-danger-bg); }
    .step.is-invalidated { border-left-color: var(--color-warning-text); background: var(--color-warning-bg); }
    .step.is-failed .marker { background: var(--color-danger-bg); color: var(--color-danger-text); }
    .step.is-invalidated .marker { background: var(--color-warning-bg); color: var(--color-warning-text); }
    .diff-block {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      background: var(--color-neutral-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: var(--space-3);
      overflow-x: auto;
      white-space: pre;
      max-width: 100%;
    }
    .diff-add { color: var(--color-success-text); }
    .diff-del { color: var(--color-danger-text); }
    .json-editor { width: 100%; min-height: 220px; resize: vertical; }
    .field-row { margin-bottom: var(--space-3); }
    .field-row label { display: block; margin-bottom: var(--space-1); }
    .field-row select, .field-row input[type="number"] { width: 100%; max-width: 320px; }
    .confirm-exposure {
      background: var(--color-warning-bg); color: var(--color-warning-text);
      border: 1px solid #f0dca0; border-radius: var(--radius); padding: var(--space-2) var(--space-3);
      margin-bottom: var(--space-3); font-size: 0.9rem;
    }
    .step .marker {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--color-neutral-bg);
      color: var(--color-neutral-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .step.is-done .marker { background: var(--color-success-bg); color: var(--color-success-text); }
    .step.is-current .marker { background: var(--color-primary); color: #fff; }
    .step > div:last-child { flex: 1 1 auto; min-width: 0; }
    .step h3 { margin: 0 0 var(--space-1); font-size: 1rem; }
    form.inline-form { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
    label { font-weight: 600; font-size: 0.9rem; }
    select {
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      font-size: 0.95rem;
    }
    textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: var(--space-2);
    }
    @media (max-width: 640px) {
      main { padding: var(--space-3); }
      .table-wrap table { min-width: 640px; }
      dl.kv { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1><a href="{% url 'job_applications:dashboard' %}">Resume Builder</a></h1>
    <nav class="site-nav">
      <a href="{% url 'job_applications:dashboard' %}">Dashboard</a>
      <a href="{% url 'job_intake:intake' %}">New application</a>
    </nav>
  </header>
  <main>
    <nav class="breadcrumbs" aria-label="Breadcrumb">{% block breadcrumbs %}Dashboard{% endblock %}</nav>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
